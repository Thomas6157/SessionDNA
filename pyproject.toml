[project]
name = "sessiondna"
version = "2.0.0"
description = "Carnet triathlon personnel et laboratoire de data science"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fitdecode==0.11.0",
  "pandas==3.0.5",
  "matplotlib==3.11.2",
  "scikit-learn==1.9.1",
  "numpy==2.5.3",
  "threadpoolctl==3.7.0",
  "garminconnect==0.3.10",
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "duckdb==1.5.6",
  "ruptures==1.1.10",
  "shap==0.52.0",
  "mlflow-skinny==3.16.1",
  "sqlalchemy==2.1.1",
  "alembic==1.20.0",
  "pyarrow==25.0.1",
  "pydantic-ai-slim[openai]==2.52.0",
  "python-multipart==0.0.32",
  "pillow==12.3.0"
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.16.9"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
